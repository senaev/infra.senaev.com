# Pre-push only, on purpose. The same checks at commit time would run on every commit of a
# branch and get bypassed with --no-verify; at push time they run once. CI runs them again
# regardless, so this hook is a fast local signal, not the gate.
#
# One command, because `npm run simple-checks` already runs lint, typecheck, the tests and the
# Python/shell/Helm syntax checks concurrently and prints a single summary.
pre-push:
  commands:
    simple-checks:
      run: npm run simple-checks

# The hooks are shared by all worktrees, and a new worktree has no node_modules until the
# post-checkout hook below installs them: use the lefthook of the worktree when it has one, else
# the one of the main checkout. Pasted into the hook inside double quotes, so it uses none.
lefthook: $(l=$(git rev-parse --show-toplevel)/node_modules/.bin/lefthook; [ -x $l ] || l=$(git rev-parse --path-format=absolute --git-common-dir)/../node_modules/.bin/lefthook; echo $l)

# Installs the dependencies of a new worktree; scripts/post-checkout.sh skips other checkouts.
post-checkout:
  commands:
    install-dependencies:
      run: bash scripts/post-checkout.sh {1}
