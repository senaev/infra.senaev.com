# Pre-push only, on purpose. The same three checks at commit time would run on every
# commit of a branch and get bypassed with --no-verify; at push time they run once.
# CI runs them again regardless, so this hook is a fast local signal, not the gate.
pre-push:
  parallel: false
  commands:
    lint:
      run: npm run lint
    typecheck:
      run: npm run typecheck
    test:
      run: npm test
