apiVersion: v1
kind: Pod
metadata:
  name: claude-code-spike
  namespace: senaev-com
spec:
  restartPolicy: Never
  nodeSelector:
    vps: senaev-madrid
  containers:
    - name: claude
      image: node:22-bookworm
      command: ["sleep", "infinity"]
      env:
        - name: HOME
          value: /home/claude
      volumeMounts:
        - name: home
          mountPath: /home/claude
        - name: code
          mountPath: /code
  volumes:
    - name: home
      hostPath:
        path: /k3s-cluster/volumes/claude-code-spike
        type: DirectoryOrCreate
    - name: code
      emptyDir: {}
