# Central telemetry runs on Madrid using manually migrated existing data.
# See projects/2026-11-14-18-42-migrate-telemetry-to-madrid/migration.md.
victoria-metrics-k8s-stack:
  # Victoria Metrics Operator is installed separately
  # https://docs.victoriametrics.com/helm/victoria-metrics-k8s-stack/#install-operator-separately
  victoria-metrics-operator:
    enabled: false
    crds:
      cleanup:
        enabled: false

  grafana:
    enabled: true
    # Required by the chart-provisioned VictoriaMetrics (DS) datasource.
    plugins:
      - victoriametrics-metrics-datasource
    replicas: 1
    nodeSelector:
      vps: senaev-madrid
    annotations:
      secret.reloader.stakater.com/reload: "senaev-com-kv-secrets"
    # The data directory is a hostPath on the node, not a PVC. It keeps the Grafana database
    # across restarts: the mcp-grafana service account and its token, and the dashboards and
    # alerts made in the UI or over MCP. `type: Directory` makes the pod wait if the directory
    # is missing, instead of silently starting with an empty database. The pod runs as 472, so
    # the directory must be owned by 472:472. Plugins and provisioned dashboards stay in the
    # chart's emptyDir at /var/lib/grafana and are rebuilt at every start.
    persistence:
      enabled: false
    grafana.ini:
      paths:
        data: /var/lib/grafana-data
    # Not `extraVolumes`: the chart does not template that list, so it cannot use the global path.
    extraContainerVolumes:
      - name: grafana-data
        hostPath:
          path: "{{ .Values.global.clusterRootPath }}/volumes/grafana"
          type: Directory
    extraVolumeMounts:
      - name: grafana-data
        mountPath: /var/lib/grafana-data
    # The disk is ReadWriteOnce and holds one SQLite file, so two pods must not overlap: the old
    # pod stops before the new one starts. Not `Recreate`: Helm's server-side apply cannot remove
    # the live rollingUpdate field, and Kubernetes rejects that field together with Recreate.
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    admin:
      existingSecret: senaev-com-kv-secrets
      userKey: GRAFANA_ADMIN_USER
      passwordKey: GRAFANA_ADMIN_PASSWORD
    ingress:
      enabled: true
      ingressClassName: traefik-hetzner
      path: /
      pathType: Prefix
      hosts:
        - grafana.senaev.com
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
      tls:
        - hosts:
            - grafana.senaev.com

  vmsingle:
    enabled: true
    ingress:
      enabled: true
      ingressClassName: traefik-hetzner
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
        traefik.ingress.kubernetes.io/router.middlewares: "{{ .Release.Namespace }}-victoriametrics-basicauth@kubernetescrd"
      hosts:
        - victoriametrics.senaev.com
      tls:
        - hosts:
            - victoriametrics.senaev.com
    spec:
      paused: false
      replicaCount: 1
      # No PVC: the operator uses a volume named `data` for /victoria-metrics-data, and it
      # allows that only when `storage` is unset. The disk has no size limit; the old 50Gi
      # claim size was only a declaration. `type: Directory` makes the pod wait if the
      # directory is missing, instead of silently starting with an empty database.
      # `null` removes the chart default only when this file is passed with `-f`, as
      # upgrade-namespace.sh does.
      storage: null
      volumes:
        - name: data
          hostPath:
            path: "{{ .helm.Values.global.clusterRootPath }}/volumes/victoriametrics"
            type: Directory
      retentionPeriod: "3"
      nodeSelector:
        vps: senaev-madrid

  vmagent:
    enabled: true
    spec:
      scrapeInterval: 30s
      nodeSelector:
        vps: senaev-madrid

  alertmanager:
    enabled: true
    ingress:
      enabled: true
      ingressClassName: traefik-hetzner
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
        traefik.ingress.kubernetes.io/router.middlewares: "{{ .Release.Namespace }}-alertmanager-basicauth@kubernetescrd"
      hosts:
        - alertmanager.senaev.com
      tls:
        - hosts:
            - alertmanager.senaev.com
    spec:
      externalURL: https://alertmanager.senaev.com
      nodeSelector:
        vps: senaev-madrid
    useManagedConfig: true
    config:
      route:
        receiver: blackhole
        routes:
          # The always-firing heartbeat, resent every minute; see the alerting-heartbeat rule.
          - matchers:
              - route="alerting-heartbeat"
            receiver: alerting-heartbeat-receiver
            group_wait: 0s
            group_interval: 30s
            repeat_interval: 1m
          - matchers:
              - route="senaev-com-alerts"
            receiver: telegram-alerts-receiver
            group_wait: 0s
            group_interval: 10s
            repeat_interval: 24h
      receivers:
        - name: blackhole
        - name: alerting-heartbeat-receiver
          webhook_configs:
            - url: http://cluster-helper.senaev-com.svc.cluster.local/alertmanager/heartbeat
              send_resolved: false
        - name: telegram-alerts-receiver
          webhook_configs:
            - url: http://cluster-helper.senaev-com.svc.cluster.local/alertmanager/webhook
              send_resolved: true

  vmalert:
    enabled: true
    ingress:
      enabled: true
      ingressClassName: traefik-hetzner
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
        traefik.ingress.kubernetes.io/router.middlewares: "{{ .Release.Namespace }}-vmalert-basicauth@kubernetescrd"
      hosts:
        - vmalert.senaev.com
      tls:
        - hosts:
            - vmalert.senaev.com
    spec:
      evaluationInterval: 30s
      nodeSelector:
        vps: senaev-madrid

  kube-state-metrics:
    enabled: true
    nodeSelector:
      vps: senaev-madrid

  prometheus-node-exporter:
    vmScrape:
      spec:
        # Helm replaces lists, so this repeats the chart's endpoint (version 0.72.2) and adds
        # relabelConfigs: a `node` label with the Kubernetes node name, so that node alerts
        # name the VPS instead of only its tailnet IP and the exporter pod.
        endpoints:
          - port: metrics
            relabelConfigs:
              - source_labels: [__meta_kubernetes_pod_node_name]
                target_label: node
            metricRelabelConfigs:
              - action: drop
                source_labels: [mountpoint]
                regex: "/var/lib/kubelet/pods.+"

smokepingProber:
  enabled: true
  namespace: telemetry
  port: 9374
  scrapeInterval: 120s
  targets:
    - hetzner
    - firstvds
    - senaev-media
    - proxmox-madrid
    - senaev-madrid
    - senaev.com
    - senaev.ru
  extraTargets: []
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

iperf3Monitor:
  enabled: true
  sourceVpsList:
    - hetzner
    - firstvds
    - senaev-media
    - proxmox-madrid
    - senaev-madrid
  tests:
    - source: hetzner
      target: firstvds
    - source: firstvds
      target: hetzner
    - source: senaev-media
      target: hetzner
    - source: senaev-media
      target: firstvds
    # Download direction to home (2026-11-20, VPN repair project).
    - source: hetzner
      target: senaev-media
    - source: firstvds
      target: senaev-media
    - source: proxmox-madrid
      target: hetzner
    - source: proxmox-madrid
      target: firstvds
    - source: senaev-madrid
      target: hetzner
    - source: senaev-madrid
      target: firstvds
  scheduler:
    enabled: true
    vps: senaev-madrid
    port: 9579
    pauseBetweenTests: 300
    scrapeInterval: 30s
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
  agent:
    port: 9580
    period: 10
    timeout: 30
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
  server:
    port: 5201

# Grafana MCP server, reachable only through cluster-helper at https://<clusterHelper.mcpDomain>/grafana.
mcpGrafana:
  enabled: true
  vps: senaev-madrid
  image: grafana/mcp-grafana:2.0.2
  grafanaUrl: http://vm-stack-grafana.telemetry.svc.cluster.local
