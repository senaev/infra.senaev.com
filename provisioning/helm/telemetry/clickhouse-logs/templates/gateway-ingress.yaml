apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-logs-gateway-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: otel-logs-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: otel-logs-agent
      ports:
        - port: 4317
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - port: 8888
          protocol: TCP
