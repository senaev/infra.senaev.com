{{- range $account := list "writer" "reader" }}
{{- $key := printf "CLICKHOUSE_%s_PASSWORD" (upper $account) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-logs-{{ $account }}
  namespace: {{ $.Release.Namespace }}
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: vault-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: clickhouse-logs-{{ $account }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $key }}
      remoteRef:
        key: senaev-com-kv
        property: {{ $key }}
{{- end }}
