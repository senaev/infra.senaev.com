apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-logs-config
  namespace: {{ .Release.Namespace }}
data:
  server.xml: |
    {{- .Files.Get "files/server.xml" | nindent 4 }}
  users.xml: |
    {{- .Files.Get "files/users.xml" | nindent 4 }}
  otel-logs.sql: |
    {{- .Files.Get "files/otel-logs.sql" | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse-logs
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: clickhouse-logs
  ports:
    - name: native
      port: 9000
      targetPort: native
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse-logs
  namespace: {{ .Release.Namespace }}
  annotations:
    secret.reloader.stakater.com/reload: "clickhouse-logs-reader,clickhouse-logs-writer"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: clickhouse-logs
  template:
    metadata:
      labels:
        app: clickhouse-logs
      annotations:
        checksum/config: {{ (.Files.Glob "files/*").AsConfig | sha256sum }}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        vps: {{ .Values.clickhouse.vps | quote }}
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clickhouse
          image: {{ .Values.clickhouse.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: CLICKHOUSE_SKIP_USER_SETUP
              value: "1"
            - name: CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS
              value: "1"
            - name: CLICKHOUSE_INIT_TIMEOUT
              value: "90"
            - name: CLICKHOUSE_READER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-logs-reader
                  key: CLICKHOUSE_READER_PASSWORD
            - name: CLICKHOUSE_WRITER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-logs-writer
                  key: CLICKHOUSE_WRITER_PASSWORD
          ports:
            - name: native
              containerPort: 9000
            - name: http
              containerPort: 8123
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml .Values.clickhouse.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: config
              mountPath: /etc/clickhouse-server/config.d/telemetry.xml
              subPath: server.xml
              readOnly: true
            - name: config
              mountPath: /etc/clickhouse-server/users.d/telemetry.xml
              subPath: users.xml
              readOnly: true
            - name: config
              mountPath: /docker-entrypoint-initdb.d/otel-logs.sql
              subPath: otel-logs.sql
              readOnly: true
      volumes:
        - name: data
          hostPath:
            path: {{ printf "%s/volumes/clickhouse-logs" .Values.global.clusterRootPath | quote }}
            type: DirectoryOrCreate
        - name: config
          configMap:
            name: clickhouse-logs-config
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickhouse-logs-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: clickhouse-logs
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: otel-logs-gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
              app.kubernetes.io/instance: vm-stack
      ports:
        - port: 9000
          protocol: TCP
