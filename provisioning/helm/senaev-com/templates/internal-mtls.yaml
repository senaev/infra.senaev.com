# Leaf certificates for the mTLS between our Node.js services, issued by the private CA.
# The DNS name is the identity of the service.
{{- if .Values.obsidianSync.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: obsidian-sync-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: obsidian-sync-tls
  dnsNames:
    - obsidian-sync.{{ .Release.Namespace }}.svc.cluster.local
  usages:
    - digital signature
    - server auth
  {{- toYaml .Values.global.internalMtlsCertificate | nindent 2 }}
---
{{- end }}
{{- if .Values.mediaServerHelper.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: media-server-helper-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: media-server-helper-tls
  dnsNames:
    - media-server-helper.{{ .Release.Namespace }}.svc.cluster.local
  usages:
    - digital signature
    - server auth
  {{- toYaml .Values.global.internalMtlsCertificate | nindent 2 }}
---
{{- end }}
{{- if .Values.nodeShell.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: node-shell-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: node-shell-tls
  dnsNames:
    - node-shell.{{ .Release.Namespace }}.svc.cluster.local
  usages:
    - digital signature
    - server auth
  {{- toYaml .Values.global.internalMtlsCertificate | nindent 2 }}
---
{{- end }}
{{- if .Values.clusterHelper.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cluster-helper-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: cluster-helper-tls
  dnsNames:
    - cluster-helper.{{ .Release.Namespace }}.svc.cluster.local
  usages:
    - digital signature
    - client auth
    - server auth
  {{- toYaml .Values.global.internalMtlsCertificate | nindent 2 }}
{{- end }}
