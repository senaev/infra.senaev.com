{{- if .Values.opencodeTelegram.enabled }}
{{- $oauth := .Values.opencodeTelegram.mcpOAuth }}
{{- $agent := .Files.Get "config/coding-agents.json" | mustFromJson }}
{{- $ports := dict }}
{{- range $name, $port := $oauth.servers }}
{{- if not (hasKey $agent.mcp $name) }}
{{- fail (printf "MCP OAuth callback server %s is not in coding-agents.json" $name) }}
{{- end }}
{{- if not (regexMatch "^[a-zA-Z0-9_-]+$" $name) }}
{{- fail "MCP OAuth callback names must contain only letters, digits, underscores or hyphens" }}
{{- end }}
{{- if or (lt (int $port) 1024) (gt (int $port) 65535) (eq (int $port) 4096) (eq (int $port) 8081) (hasKey $ports (toString $port)) }}
{{- fail "MCP OAuth callback ports must be unique, unprivileged and distinct from 4096/8081" }}
{{- end }}
{{- $_ := set $ports (toString $port) true }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-mcp-oauth
  namespace: {{ .Release.Namespace }}
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    # Callback request URIs contain authorization codes: never log them.
    error_log /dev/stderr crit;
    events { worker_connections 128; }
    http {
      access_log off;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      server {
        listen 8081;
        server_name _;
        location = /healthz { return 200 'ok'; }
{{- range $name, $port := $oauth.servers }}
        location = /mcp/oauth/{{ $name }}/callback {
          limit_except GET { deny all; }
          proxy_pass http://127.0.0.1:{{ $port }};
          proxy_set_header Host 127.0.0.1;
          proxy_set_header Authorization "";
          proxy_set_header Cookie "";
          proxy_connect_timeout 2s;
          proxy_read_timeout 60s;
          add_header Cache-Control "no-store" always;
          add_header Referrer-Policy "no-referrer" always;
        }
{{- end }}
        location / { return 404; }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: opencode-mcp-oauth
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: opencode-telegram
  ports:
    - name: http
      port: 8081
      targetPort: mcp-oauth
---
# Callback only: OpenCode validates OAuth state and exchanges the code with PKCE.
# Native web/API authentication remains on the existing port 4096 ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opencode-mcp-oauth
  namespace: {{ .Release.Namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik-hetzner
  tls:
    - hosts: [{{ $oauth.hostname | quote }}]
  rules:
    - host: {{ $oauth.hostname | quote }}
      http:
        paths:
{{- range $name, $_ := $oauth.servers }}
          - path: /mcp/oauth/{{ $name }}/callback
            pathType: Exact
            backend:
              service:
                name: opencode-mcp-oauth
                port:
                  number: 8081
{{- end }}
{{- end }}
