apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: senaev-com-alerts
  namespace: telemetry
spec:
  groups:
    - name: overheating
      rules:
        - alert: node-overheating
          expr: |
            node_hwmon_temp_celsius{job="node-exporter",cluster=~".*"} > 100
          for: 10s
          labels:
            severity: critical
            route: senaev-com-alerts
        - alert: nvme-temp1-overheating
          expr: |
            node_hwmon_temp_celsius{cluster=~".*", chip="nvme_nvme0", sensor="temp1"} > 77.5
          for: 10s
          labels:
            severity: critical
            route: senaev-com-alerts
    # Dead man's switch: always firing while metrics are fresh. Alertmanager sends it to
    # cluster-helper (on another node) about once a minute; cluster-helper reports to Telegram
    # when the heartbeats stop. See cluster-helper/src/alerts/alertingHeartbeatMonitor.ts.
    - name: alerting-heartbeat
      rules:
        - alert: alerting-heartbeat
          # True only if vmagent wrote a node-exporter `up` sample in the last 2 minutes, so a
          # heartbeat proves the whole path: vmagent, VMSingle, vmalert and Alertmanager.
          expr: |
            count(time() - tlast_over_time(up{job="node-exporter"}[5m]) < 120) > 0
          labels:
            severity: info
            route: alerting-heartbeat
    - name: node-disk
      rules:
        - alert: node-disk-space-low
          # The same threshold as the k3s kubelet: it evicts pods below 5% free on the disk of
          # /var/lib/kubelet and containerd, which is `/` on every node (k3s default
          # evictionHard nodefs.available and imagefs.available, not overridden here). Other
          # disks are not watched: media-server-helper keeps senaev-media /mnt/sdb1 at 95-98%
          # used on purpose.
          expr: |
            node_filesystem_avail_bytes{job="node-exporter", mountpoint="/"}
            / node_filesystem_size_bytes{job="node-exporter", mountpoint="/"}
            < 0.05
          for: 10s
          labels:
            severity: warning
            route: senaev-com-alerts
          annotations:
            summary: "{{`{{ $value | humanizePercentage }}`}} free on {{`{{ $labels.mountpoint }}`}} ({{`{{ $labels.device }}`}}); k3s evicts pods below 5%"
    # VPN profile 1 (home -> FirstVDS -> Tailscale -> Hetzner) is the route that works from home.
    # See projects/2026-06-10-debug-vpn-connection/README.md
    - name: vpn
      rules:
        # Through the VPN most parity checks fail while the same checks without the VPN pass, so it
        # is the VPN path and not the home internet. About 6 checks in 30 minutes.
        - alert: vpn-profile-1-failing
          expr: |
            (
              sum(increase(vpn_probe_checks_total{profile_index="1", route="vpn", check=~"parity_.*", result="failure"}[30m]))
              / sum(increase(vpn_probe_checks_total{profile_index="1", route="vpn", check=~"parity_.*"}[30m]))
              > 0.5
            )
            and on() (sum(increase(vpn_probe_checks_total{profile_index="1", route="direct", check=~"parity_.*", result="success"}[30m])) > 0)
          for: 10m
          labels:
            severity: warning
            route: senaev-com-alerts
          annotations:
            summary: "{{`{{ $value | humanizePercentage }}`}} of VPN profile 1 checks fail from home in 30 minutes; direct checks pass"
            description: "Check firstvds (vpn-firstvds-stalled) and the Tailscale link firstvds <-> hetzner (smokeping, iperf3)."
        # Tailscale ping to firstvds from all nodes: normally 17-70 ms. On 2026-11-26 19:40-21:30 UTC
        # it was 0.5-16 s (the VM stalled at the provider) and profile 1 failed.
        - alert: vpn-firstvds-stalled
          expr: |
            label_replace(
              avg(
                rate(smokeping_response_duration_seconds_sum{host="firstvds"}[5m])
                / rate(smokeping_response_duration_seconds_count{host="firstvds"}[5m])
              ) > 0.5,
              "node", "firstvds", "", ""
            )
          for: 5m
          labels:
            severity: warning
            route: senaev-com-alerts
          annotations:
            summary: "Tailscale ping to firstvds takes {{`{{ $value | humanizeDuration }}`}} on average (normally under 0.1 s)"
            description: "firstvds (VPN entry of profile 1, senaev.ru) stalls or is overloaded; VPN profile 1 likely fails."
    - name: obsidian-vault
      rules:
        - alert: obsidian-vault-file-too-large
          expr: |
            obsidian_vault_largest_file_bytes{namespace="{{ .Release.Namespace }}"} > 4500000
          for: 2m
          labels:
            severity: warning
            route: senaev-com-alerts
          annotations:
            summary: "Obsidian vault file exceeds 4.5 MB: {{`{{ $labels.path }}`}}"
            description: "Vault file {{`{{ $labels.path }}`}} is {{`{{ $value }}`}} bytes; Obsidian Sync Standard rejects files larger than 5 MB."
        - alert: obsidian-vault-telemetry-unavailable
          expr: |
            (obsidian_vault_scan_success{namespace="{{ .Release.Namespace }}"} == 0)
            or absent(obsidian_vault_scan_success{namespace="{{ .Release.Namespace }}"})
            or (time() - obsidian_vault_last_scan_timestamp_seconds{namespace="{{ .Release.Namespace }}"} > 180)
          for: 5m
          labels:
            severity: warning
            route: senaev-com-alerts
          annotations:
            summary: "Obsidian vault telemetry unavailable or stale"
            description: "Vault inventory scanning or metrics scraping has failed for more than five minutes."
    - name: node-connectivity
      rules:
        - alert: node-connectivity-failed-to-node-media
          expr: |
            kube_node_status_condition{node="{{ .Values.global.mediaServerNodeName }}", condition="Ready", status="true"} != 1
            or
            absent(kube_node_status_condition{node="{{ .Values.global.mediaServerNodeName }}"})
          for: 60s
          labels:
            severity: critical
            route: senaev-com-alerts
    # The internal mTLS leaves last 168 h and renew 72 h before the end (global-values.yaml), so a
    # renewal that fails shows as a failure of the services only days later.
    - name: internal-certificates
      rules:
        - alert: certificate-not-ready
          expr: |
            certmanager_certificate_ready_status{condition="True"} == 0
          for: 15m
          labels:
            severity: warning
            route: senaev-com-alerts
          annotations:
            summary: "Certificate {{`{{ $labels.namespace }}`}}/{{`{{ $labels.name }}`}} is not ready"
            description: "cert-manager cannot issue or renew it. Check `kubectl describe certificate` and the cert-manager logs."
        # A leaf is renewed 3 days before the end. Less than 2 days left means that the renewal has
        # failed for a day already.
        - alert: certificate-expires-soon
          expr: |
            certmanager_certificate_expiration_timestamp_seconds - time() < 2 * 86400
          for: 5m
          labels:
            severity: critical
            route: senaev-com-alerts
          annotations:
            summary: "Certificate {{`{{ $labels.namespace }}`}}/{{`{{ $labels.name }}`}} expires in {{`{{ $value | humanizeDuration }}`}}"
            description: "Services that use it stop accepting its callers when it expires."
        - alert: certificate-metrics-unavailable
          expr: |
            absent(certmanager_certificate_expiration_timestamp_seconds)
          for: 15m
          labels:
            severity: warning
            route: senaev-com-alerts
          annotations:
            summary: "No cert-manager certificate metrics"
            description: "cert-manager is down, or vmagent cannot scrape it. The certificate alerts cannot fire."
    {{- if .Values.llmServer.enabled }}
    # The webhook in cluster-helper needs the job, instance and pod labels, so these rules use
    # kube-state-metrics series and keep their labels.
    - name: llm-server
      rules:
        - alert: llm-server-oom-killed
          expr: |
            (increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}", container="llm-server"}[5m]) > 0)
            and on(namespace, pod, container)
            (kube_pod_container_status_last_terminated_reason{namespace="{{ .Release.Namespace }}", container="llm-server", reason="OOMKilled"} == 1)
          labels:
            severity: critical
            route: senaev-com-alerts
        # Also covers a failed model download and CrashLoopBackOff. Scaling to 0 does not fire it.
        - alert: llm-server-unavailable
          expr: |
            kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}", deployment="llm-server"}
            < kube_deployment_spec_replicas{namespace="{{ .Release.Namespace }}", deployment="llm-server"}
          for: 10m
          labels:
            severity: critical
            route: senaev-com-alerts
    {{- end }}
