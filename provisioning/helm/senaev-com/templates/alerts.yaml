apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: senaev-com-alerts
  namespace: telemetry
spec:
  groups:
    - name: overheating
      rules:
        - alert: node-overheating
          expr: |
            node_hwmon_temp_celsius{job="node-exporter",cluster=~".*"} > 100
          for: 10s
          labels:
            severity: critical
            route: senaev-com-alerts
        - alert: nvme-temp1-overheating
          expr: |
            node_hwmon_temp_celsius{cluster=~".*", chip="nvme_nvme0", sensor="temp1"} > 77.5
          for: 10s
          labels:
            severity: critical
            route: senaev-com-alerts
    - name: node-disk
      rules:
        - alert: node-disk-space-low
          expr: |
            (
              node_filesystem_avail_bytes{fstype!="", job="node-exporter"} < 5 * 1024 * 1024 * 1024
            )
            and
            (
              node_filesystem_size_bytes{fstype!="", job="node-exporter"} > 10 * 1024 * 1024 * 1024
            )
          for: 10s
          labels:
            severity: warning
            route: senaev-com-alerts
    - name: obsidian-vault
      rules:
        - alert: obsidian-vault-file-too-large
          expr: |
            obsidian_vault_largest_file_bytes{namespace="{{ .Release.Namespace }}"} > 4500000
          for: 2m
          labels:
            severity: warning
            route: senaev-com-alerts
          annotations:
            summary: "Obsidian vault file exceeds 4.5 MB: {{`{{ $labels.path }}`}}"
            description: "Vault file {{`{{ $labels.path }}`}} is {{`{{ $value }}`}} bytes; Obsidian Sync Standard rejects files larger than 5 MB."
        - alert: obsidian-vault-telemetry-unavailable
          expr: |
            (obsidian_vault_scan_success{namespace="{{ .Release.Namespace }}"} == 0)
            or absent(obsidian_vault_scan_success{namespace="{{ .Release.Namespace }}"})
            or (time() - obsidian_vault_last_scan_timestamp_seconds{namespace="{{ .Release.Namespace }}"} > 180)
          for: 5m
          labels:
            severity: warning
            route: senaev-com-alerts
          annotations:
            summary: "Obsidian vault telemetry unavailable or stale"
            description: "Vault inventory scanning or metrics scraping has failed for more than five minutes."
    - name: node-connectivity
      rules:
        - alert: node-connectivity-failed-to-node-media
          expr: |
            kube_node_status_condition{node="{{ .Values.mediaServerNodeName }}", condition="Ready", status="true"} != 1
            or
            absent(kube_node_status_condition{node="{{ .Values.mediaServerNodeName }}"})
          for: 60s
          labels:
            severity: critical
            route: senaev-com-alerts
    {{- if .Values.llmServer.enabled }}
    # The webhook in cluster-helper needs the job, instance and pod labels, so these rules use
    # kube-state-metrics series and keep their labels.
    - name: llm-server
      rules:
        - alert: llm-server-oom-killed
          expr: |
            (increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}", container="llm-server"}[5m]) > 0)
            and on(namespace, pod, container)
            (kube_pod_container_status_last_terminated_reason{namespace="{{ .Release.Namespace }}", container="llm-server", reason="OOMKilled"} == 1)
          labels:
            severity: critical
            route: senaev-com-alerts
        - alert: llm-server-restarted
          expr: |
            (increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}", container="llm-server"}[5m]) > 0)
            unless on(namespace, pod, container)
            (kube_pod_container_status_last_terminated_reason{namespace="{{ .Release.Namespace }}", container="llm-server", reason="OOMKilled"} == 1)
          labels:
            severity: warning
            route: senaev-com-alerts
        # Also covers a failed model download and CrashLoopBackOff. Scaling to 0 does not fire it.
        - alert: llm-server-unavailable
          expr: |
            kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}", deployment="llm-server"}
            < kube_deployment_spec_replicas{namespace="{{ .Release.Namespace }}", deployment="llm-server"}
          for: 10m
          labels:
            severity: critical
            route: senaev-com-alerts
    {{- end }}
