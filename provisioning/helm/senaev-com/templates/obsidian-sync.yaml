{{- if .Values.obsidianSync.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obsidian-sync
  namespace: {{ .Release.Namespace }}
  labels:
    app: obsidian-sync
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: obsidian-sync
  template:
    metadata:
      labels:
        app: obsidian-sync
        admission.datadoghq.com/enabled: "true"
        tags.datadoghq.com/service: obsidian-sync
        tags.datadoghq.com/env: prod
        tags.datadoghq.com/version: latest
      annotations:
        secret.reloader.stakater.com/reload: "senaev-com-kv-secrets"
    spec:
      nodeSelector:
        vps: {{ .Values.obsidianSync.vps }}
      initContainers:
        - name: fix-permissions
          image: busybox:1.37.0-uclibc
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - sh
            - -c
            - |
              chown -R 1000:1000 {{ .Values.obsidianSync.containerVaultPath }}
          volumeMounts:
            - name: vault
              mountPath: {{ .Values.obsidianSync.containerVaultPath }}
      containers:
        - name: obsidian-sync
          image: ghcr.io/senaev/obsidian-sync:latest
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: OBSIDIAN_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: senaev-com-kv-secrets
                  key: OBSIDIAN_AUTH_TOKEN
                  optional: false
            - name: OBSIDIAN_VAULT_NAME
              valueFrom:
                secretKeyRef:
                  name: senaev-com-kv-secrets
                  key: OBSIDIAN_VAULT_NAME
                  optional: false
            - name: OBSIDIAN_VAULT_PATH
              value: {{ .Values.obsidianSync.containerVaultPath }}
            - name: TG_CLUSTER_CHAT_ID
              value: {{ .Values.telegramClusterChatId | quote }}
            - name: TG_TOKEN_SENAEV_COM_BOT
              valueFrom:
                secretKeyRef:
                  name: senaev-com-kv-secrets
                  key: TG_TOKEN_SENAEV_COM_BOT
                  optional: false
            - name: INTERNAL_TOKEN_BETWEEN_CLUSTER_HELPER_AND_OBSIDIAN
              valueFrom:
                secretKeyRef:
                  name: senaev-com-kv-secrets
                  key: INTERNAL_TOKEN_BETWEEN_CLUSTER_HELPER_AND_OBSIDIAN
                  optional: false
          volumeMounts:
            - name: vault
              mountPath: {{ .Values.obsidianSync.containerVaultPath }}
      volumes:
        - name: vault
          hostPath:
            path: {{ .Values.clusterRootPath }}/{{ .Values.obsidianSync.volumePath }}
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: obsidian-sync
  namespace: {{ .Release.Namespace }}
  labels:
    app: obsidian-sync
spec:
  type: ClusterIP
  selector:
    app: obsidian-sync
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
# Only its two callers can reach obsidian-sync, as a second barrier behind the internal
# token: cluster-helper (all routes) and nextjs-app (the public ?note=/?file= routes).
# Egress is not limited, because `ob sync` needs the internet. k3s enforces this with its
# built-in kube-router policy controller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: obsidian-sync
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: obsidian-sync
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cluster-helper
        - podSelector:
            matchLabels:
              app: nextjs-app
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
