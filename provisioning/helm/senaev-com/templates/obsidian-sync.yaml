{{- if .Values.obsidianSync.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obsidian-sync
  namespace: {{ .Release.Namespace }}
  labels:
    app: obsidian-sync
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: obsidian-sync
  template:
    metadata:
      labels:
        app: obsidian-sync
        vps: {{ .Values.obsidianSync.vps }}
        admission.datadoghq.com/enabled: "true"
        tags.datadoghq.com/service: obsidian-sync
        tags.datadoghq.com/env: prod
        tags.datadoghq.com/version: latest
      annotations:
        secret.reloader.stakater.com/reload: "senaev-com-kv-secrets"
    spec:
      nodeSelector:
        vps: {{ .Values.obsidianSync.vps }}
      initContainers:
        - name: fix-permissions
          image: busybox:1.37.0-uclibc
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - sh
            - -c
            - |
              chown -R 1000:1000 {{ .Values.obsidianSync.containerVaultPath }}
          volumeMounts:
            - name: vault
              mountPath: {{ .Values.obsidianSync.containerVaultPath }}
      containers:
        - name: obsidian-sync
          image: ghcr.io/senaev/obsidian-sync:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
          env:
            - name: OBSIDIAN_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: senaev-com-kv-secrets
                  key: OBSIDIAN_AUTH_TOKEN
                  optional: false
            - name: OBSIDIAN_VAULT_NAME
              valueFrom:
                secretKeyRef:
                  name: senaev-com-kv-secrets
                  key: OBSIDIAN_VAULT_NAME
                  optional: false
            - name: OBSIDIAN_VAULT_PATH
              value: {{ .Values.obsidianSync.containerVaultPath }}
            - name: TG_CLUSTER_CHAT_ID
              value: {{ .Values.global.telegramClusterChatId | quote }}
            - name: TG_TOKEN_SENAEV_COM_BOT
              valueFrom:
                secretKeyRef:
                  name: senaev-com-kv-secrets
                  key: TG_TOKEN_SENAEV_COM_BOT
                  optional: false
            - name: MTLS_DIR
              value: /etc/mtls
            - name: MTLS_ALLOWED_CLIENT_NAME
              value: cluster-helper.{{ .Release.Namespace }}.svc.cluster.local
          volumeMounts:
            - name: vault
              mountPath: {{ .Values.obsidianSync.containerVaultPath }}
            # The whole directory, never subPath or env: only a directory mount follows renewals.
            - name: mtls
              mountPath: /etc/mtls
              readOnly: true
      volumes:
        - name: vault
          hostPath:
            path: {{ .Values.global.clusterRootPath }}/{{ .Values.obsidianSync.volumePath }}
            type: DirectoryOrCreate
        - name: mtls
          secret:
            secretName: obsidian-sync-tls
---
apiVersion: v1
kind: Service
metadata:
  name: obsidian-sync
  namespace: {{ .Release.Namespace }}
  labels:
    app: obsidian-sync
spec:
  type: ClusterIP
  selector:
    app: obsidian-sync
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: https
      port: 8443
      targetPort: 8443
      protocol: TCP
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: obsidian-sync
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: obsidian-sync
  endpoints:
    - port: http
      path: /metrics
---
# Only its two application callers and vmagent can reach obsidian-sync, each on its own port.
# 8443 (mTLS, every route that reads or edits the vault): cluster-helper only. The server also
# checks the client certificate of every request. NetworkPolicy limits ports and sources, not URL
# paths, so the protected routes exist only on 8443.
# 8080 (plain HTTP, only the published-file routes and /metrics): nextjs-app and vmagent.
# Egress is not limited, because `ob sync` needs the internet. k3s enforces this with its
# built-in kube-router policy controller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: obsidian-sync
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: obsidian-sync
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cluster-helper
      ports:
        - protocol: TCP
          port: 8443
    - from:
        - podSelector:
            matchLabels:
              app: nextjs-app
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: telemetry
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
