{{- if .Values.mediaServerHelper.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-server-helper
  namespace: {{ .Release.Namespace }}
  labels:
    app: media-server-helper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-server-helper
  template:
    metadata:
      labels:
        app: media-server-helper
        vps: {{ .Values.mediaServerHelper.vps }}
        admission.datadoghq.com/enabled: "true"
        tags.datadoghq.com/service: media-server-helper
        tags.datadoghq.com/env: prod
        tags.datadoghq.com/version: latest
      annotations:
        secret.reloader.stakater.com/reload: "senaev-com-kv-secrets"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      nodeSelector:
        vps: {{ .Values.mediaServerHelper.vps }}
      initContainers:
        - name: fix-watch-folder-permissions
          image: busybox:1.37.0-uclibc
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              mkdir -p /watch-torrent-files
              mkdir -p {{ .Values.qbittorrent.paths.completed }} {{ .Values.qbittorrent.paths.convertedForMobile }}
              chown -R 1000:1000 /watch-torrent-files /downloads
          volumeMounts:
            - name: watch-torrent-files
              mountPath: /watch-torrent-files
            - name: downloads-completed
              mountPath: {{ .Values.qbittorrent.paths.completed }}
            - name: downloads-converted-for-mobile
              mountPath: /downloads/converted-for-mobile
      containers:
        - name: media-server-helper
          image: ghcr.io/senaev/media-server-helper:latest
          imagePullPolicy: Always
          ports:
            # Needs a client certificate of the internal CA; only cluster-helper may call it.
            - name: mtls
              containerPort: 8443
          env:
            - name: PERCENT_TRIGGER_TO_REMOVE
              value: {{ .Values.mediaServerHelper.percentTriggerToRemove | quote }}
            - name: PERCENT_REMOVE_TARGET
              value: {{ .Values.mediaServerHelper.percentRemoveTarget | quote }}
            - name: DISK_USAGE_PATH
              value: {{ .Values.qbittorrent.paths.completed | quote }}
            - name: TG_TOKEN_SENAEV_COM_BOT
              valueFrom:
                secretKeyRef:
                  name: senaev-com-kv-secrets
                  key: TG_TOKEN_SENAEV_COM_BOT
                  optional: false
            - name: TG_MEDIA_SERVER_CHAT_ID
              value: {{ .Values.global.telegramMediaServerChatId | quote }}
          volumeMounts:
            - name: watch-torrent-files
              mountPath: /watch-torrent-files
            - name: downloads-completed
              mountPath: {{ .Values.qbittorrent.paths.completed }}
            - name: downloads-converted-for-mobile
              mountPath: /downloads/converted-for-mobile
            # The whole directory, never subPath or env: only a directory mount follows renewals.
            # The path is MTLS_DIRECTORY in senaev-utils, which the service reads.
            - name: mtls
              mountPath: /etc/mtls
              readOnly: true
      volumes:
        - name: mtls
          secret:
            secretName: media-server-helper-tls
        - name: watch-torrent-files
          hostPath:
            path: {{ .Values.global.mediaServerStoragePath }}/{{ .Values.qbittorrent.volumePath }}{{ .Values.qbittorrent.paths.watch }}
            type: DirectoryOrCreate
        - name: downloads-completed
          hostPath:
            path: {{ .Values.global.mediaServerStoragePath }}/{{ .Values.qbittorrent.volumePath }}{{ .Values.qbittorrent.paths.completed }}
            type: DirectoryOrCreate
        - name: downloads-converted-for-mobile
          hostPath:
            path: {{ .Values.global.mediaServerStoragePath }}/{{ .Values.qbittorrent.volumePath }}{{ .Values.qbittorrent.paths.convertedForMobile }}
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: media-server-helper
  namespace: {{ .Release.Namespace }}
  labels:
    app: media-server-helper
spec:
  type: ClusterIP
  selector:
    app: media-server-helper
  ports:
    - name: mtls
      port: 8443
      targetPort: mtls
---
# Only cluster-helper reaches the mTLS port, and the server also allows it by the name in its
# certificate. There is no plain HTTP port and no probe.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: media-server-helper
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: media-server-helper
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cluster-helper
      ports:
        - protocol: TCP
          port: 8443
{{- end }}
