testEcho:
  enabled: true
  vps: hetzner

requestEcho:
  enabled: true
  vps: hetzner

# Disabled 2026-10-06: docker.io/minio/minio no longer serves public images. Data stays on
# /mnt/sdb1/volumes/minio. See tasks/2026-10-04-k3s-dual-stack-ipv6.md
minio:
  enabled: false
  vps: senaev-media
  rootUser: senaev_media_s3_admin
  volumePath: volumes/minio

# curl -u "admin_with_emoji_password:ñew 🆕 pAsSw⭕️rd" https://test.senaev.com/test-elasticsearch/my-index/_search
elasticsearch:
  enabled: false
  vps: hetzner
  elasticPassword: "bootstrap_elastic_password"
  customPassword: "ñew 🆕 pAsSw⭕️rd"
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      memory: 2Gi

ingress:
  entries:
    - name: test-direct
      className: traefik-hetzner
      hosts:
        - host: test.senaev.com
          service: test-echo
          port: 80
    - name: test-request-echo
      className: traefik-hetzner
      hosts:
        - host: test.senaev.com
          path: /echo
          service: request-echo
          port: 8080
