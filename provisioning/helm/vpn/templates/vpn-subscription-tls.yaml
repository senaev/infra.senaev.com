# The client certificate of vpn-subscription, issued by the private CA of the pki namespace. The DNS
# name is the identity: cluster-helper allows only this name on its mTLS port (VPN_SUBSCRIPTION in
# cluster-helper/src/callers.ts). The certificate authenticates vpn-subscription as a client.
{{- if .Values.vpnSubscription.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vpn-subscription-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: vpn-subscription-tls
  dnsNames:
    - vpn-subscription.{{ .Release.Namespace }}.svc.cluster.local
  usages:
    - digital signature
    - client auth
  {{- toYaml .Values.global.internalMtlsCertificate | nindent 2 }}
{{- end }}
