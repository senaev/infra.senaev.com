# The client certificate of vpn-subscription, issued by the private CA of the pki namespace. The DNS
# name is the identity: cluster-helper allows only this name on its mTLS port (VPN_SUBSCRIPTION in
# cluster-helper/src/callers.ts). It has no server usage: vpn-subscription serves no mTLS port. A new
# key is made on every renewal, 3 days before the end; the service loads it by polling.
{{- if .Values.vpnSubscription.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vpn-subscription-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: vpn-subscription-tls
  dnsNames:
    - vpn-subscription.{{ .Release.Namespace }}.svc.cluster.local
  usages:
    - digital signature
    - client auth
  duration: 168h
  renewBefore: 72h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: internal-ca
    kind: ClusterIssuer
    group: cert-manager.io
{{- end }}
