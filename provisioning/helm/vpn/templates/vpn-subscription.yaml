{{- if .Values.vpnSubscription.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpn-subscription
  namespace: {{ .Release.Namespace }}
  labels:
    app: vpn-subscription
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vpn-subscription
  template:
    metadata:
      labels:
        app: vpn-subscription
        vps: {{ .Values.vpnSubscription.vps }}
        # No APM: dd-trace writes the full path, with the subscription secret, to http.url.
        admission.datadoghq.com/enabled: "false"
        tags.datadoghq.com/service: vpn-subscription
        tags.datadoghq.com/env: prod
        tags.datadoghq.com/version: latest
      annotations:
        secret.reloader.stakater.com/reload: "senaev-com-kv-secrets"
    spec:
      nodeSelector:
        vps: {{ .Values.vpnSubscription.vps }}
      containers:
        - name: vpn-subscription
          image: ghcr.io/senaev/vpn-subscription:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: CLUSTER_HELPER_URL
              value: https://cluster-helper.senaev-com.svc.cluster.local:8443
            - name: SUBSCRIPTION_ENTRIES
              value: {{ toJson .Values.vpnSubscription.entries | quote }}
            - name: VPN_SUBSCRIPTION_CHAT_ID
              value: {{ .Values.global.telegramVpnSubscriptionChatId | quote }}
            - name: VPN_SUBSCRIPTION_SECRET
              valueFrom:
                secretKeyRef:
                  name: senaev-com-kv-secrets
                  key: VPN_SUBSCRIPTION_SECRET
                  optional: false
            - name: VPN_SUBSCRIPTION_CHAT
              valueFrom:
                secretKeyRef:
                  name: senaev-com-kv-secrets
                  key: VPN_SUBSCRIPTION_CHAT
                  optional: false
            - name: XRAY_USER_UUID
              valueFrom:
                secretKeyRef:
                  name: senaev-com-kv-secrets
                  key: XRAY_USER_UUID
                  optional: false
            - name: XRAY_REALITY_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: senaev-com-kv-secrets
                  key: XRAY_REALITY_PUBLIC_KEY
                  optional: false
          volumeMounts:
            # The whole directory, never subPath or env: only a directory mount follows renewals.
            # The path is MTLS_DIRECTORY in senaev-utils, which the service reads.
            - name: mtls
              mountPath: /etc/mtls
              readOnly: true
      volumes:
        - name: mtls
          secret:
            secretName: vpn-subscription-tls
---
apiVersion: v1
kind: Service
metadata:
  name: vpn-subscription
  namespace: {{ .Release.Namespace }}
  labels:
    app: vpn-subscription
spec:
  type: ClusterIP
  selector:
    app: vpn-subscription
  ports:
    - port: 3000
      targetPort: 3000
{{- end }}
