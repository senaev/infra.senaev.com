{{- if .Values.xrayVpn.enabled }}
{{- $root := . }}
{{- range $instance := .Values.xrayVpn.instances }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $instance.name }}-config-template
  namespace: {{ $root.Release.Namespace }}
data:
  full-config.json: |
{{ include "vpn.xrayVpnConfig" (dict "root" $root "instance" $instance) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $instance.name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    app: {{ $instance.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $instance.name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: {{ $instance.name }}
      annotations:
        secret.reloader.stakater.com/reload: "senaev-com-kv-secrets"
        configmap.reloader.stakater.com/reload: "{{ $instance.name }}-config-template"
    spec:
      nodeSelector:
        vps: {{ $instance.vps }}
      initContainers:
        - name: xray-vpn-config-subst
          image: node:22-alpine
          command:
            - sh
            - -c
            - |
{{ regexReplaceAll "(?m)^ +$" (include "vpn.renderXrayConfigScript" . | indent 14) "" }}
          env:
            - name: XRAY_USER_UUID
              valueFrom:
                secretKeyRef:
                  name: senaev-com-kv-secrets
                  key: XRAY_USER_UUID
            - name: XRAY_REALITY_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: senaev-com-kv-secrets
                  key: XRAY_REALITY_PRIVATE_KEY
          volumeMounts:
            - name: xray-vpn-config-template
              mountPath: /template
              readOnly: true
            - name: xray-vpn-config
              mountPath: /out
      containers:
        - name: xray-vpn
          image: teddysun/xray:26.9.30
          ports:
            - containerPort: 443
            {{- if ne $instance.exitEnabled false }}
            - containerPort: 1080
            {{- end }}
          volumeMounts:
            - name: xray-vpn-config
              mountPath: /etc/xray
              readOnly: true
      volumes:
        - name: xray-vpn-config-template
          configMap:
            name: {{ $instance.name }}-config-template
        - name: xray-vpn-config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $instance.name }}
  namespace: {{ $root.Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: {{ $instance.name }}
  ports:
    - name: reality
      port: 443
      targetPort: 443
    {{- if ne $instance.exitEnabled false }}
    - name: socks
      port: 1080
      targetPort: 1080
    {{- end }}
---
{{- end }}
{{- end }}
