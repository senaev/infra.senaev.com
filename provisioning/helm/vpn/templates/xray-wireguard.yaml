{{- if .Values.xrayWireguard.enabled }}
{{- $wireguard := .Values.xrayWireguard }}
# Separate from xray-vpn-<vps> and xray-hysteria: a failure here cannot affect other profiles.
apiVersion: v1
kind: ConfigMap
metadata:
  name: xray-wireguard-config-template
  namespace: {{ .Release.Namespace }}
data:
  full-config.json: |
{{ include "vpn.xrayWireguardConfig" . | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xray-wireguard
  namespace: {{ .Release.Namespace }}
  labels:
    app: xray-wireguard
spec:
  replicas: 1
  # hostPort: the old pod must release the UDP port first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: xray-wireguard
  template:
    metadata:
      labels:
        app: xray-wireguard
      annotations:
        secret.reloader.stakater.com/reload: "senaev-com-kv-secrets"
        configmap.reloader.stakater.com/reload: "xray-wireguard-config-template"
    spec:
      nodeSelector:
        vps: {{ $wireguard.vps }}
      automountServiceAccountToken: false
      initContainers:
        - name: xray-config-subst
          image: node:22-alpine
          command:
            - sh
            - -c
            - |
{{ regexReplaceAll "(?m)^ +$" (include "vpn.renderXrayConfigScript" (dict "wireguard" true) | indent 14) "" }}
          env:
            - name: XRAY_USER_UUID
              valueFrom:
                secretKeyRef:
                  name: senaev-com-kv-secrets
                  key: XRAY_USER_UUID
          volumeMounts:
            - name: config-template
              mountPath: /template
              readOnly: true
            - name: config
              mountPath: /out
      containers:
        - name: xray
          image: teddysun/xray:26.9.30
          ports:
            - name: wireguard
              containerPort: {{ $wireguard.port }}
              hostPort: {{ $wireguard.port }}
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /etc/xray
              readOnly: true
      volumes:
        - name: config-template
          configMap:
            name: xray-wireguard-config-template
        - name: config
          emptyDir: {}
{{- end }}
