{{- $hysteria := .Values.xrayHysteria }}
{{- range $instance := $hysteria.instances }}
{{- if $instance.enabled }}
{{- $name := printf "xray-hysteria-%s" $instance.name }}
---
# Separate from xray-vpn-<vps>: a failure here (certificate, UDP port) cannot affect the
# VLESS/Reality profiles.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config-template
  namespace: {{ $.Release.Namespace }}
data:
  full-config.json: |
{{ include "vpn.xrayHysteriaConfig" (dict "root" $ "instance" $instance) | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $name }}
spec:
  replicas: 1
  # hostPort: the old pod must release the UDP port first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
      annotations:
        secret.reloader.stakater.com/reload: "senaev-com-kv-secrets"
        configmap.reloader.stakater.com/reload: "{{ $name }}-config-template"
    spec:
      nodeSelector:
        vps: {{ $instance.vps }}
      {{- if $instance.hostNetwork }}
      # The pod network's MTU (~1280, flannel VXLAN over tailscale0) is below the size of QUIC
      # handshake packets (1280 bytes of UDP payload, not configurable in Xray), so the server's
      # certificate never left the pod. The node's own interface has MTU 1500.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      automountServiceAccountToken: false
      initContainers:
        - name: xray-config-subst
          image: node:22-alpine
          command:
            - sh
            - -c
            - |
{{ regexReplaceAll "(?m)^ +$" (include "vpn.renderXrayConfigScript" $ | indent 14) "" }}
          env:
            - name: XRAY_USER_UUID
              valueFrom:
                secretKeyRef:
                  name: senaev-com-kv-secrets
                  key: XRAY_USER_UUID
          volumeMounts:
            - name: config-template
              mountPath: /template
              readOnly: true
            - name: config
              mountPath: /out
        - name: certificate-init
          image: node:22-alpine
          command:
            - sh
            - -c
            - |
{{ regexReplaceAll "(?m)^ +$" (include "vpn.acmeCertificateScript" $ | indent 14) "" }}
              node /tmp/acme-certificate.mjs
          env:
            - name: SERVER_NAME
              value: {{ $instance.serverName | quote }}
          volumeMounts:
            - name: acme
              mountPath: /acme
              readOnly: true
            - name: tls
              mountPath: /tls
      containers:
        - name: xray
          image: teddysun/xray:26.9.30
          ports:
            {{- range $inbound := $instance.inbounds }}
            - name: hysteria-{{ $inbound.port }}
              containerPort: {{ $inbound.port }}
              hostPort: {{ $inbound.port }}
              protocol: UDP
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/xray
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
        # Traefik renews the certificate in acme.json; Xray reloads the files every hour.
        - name: certificate-refresh
          image: node:22-alpine
          command:
            - sh
            - -c
            - |
{{ regexReplaceAll "(?m)^ +$" (include "vpn.acmeCertificateScript" $ | indent 14) "" }}
              while true; do
                sleep 3600
                node /tmp/acme-certificate.mjs || echo "Certificate refresh failed; keeping the current files"
              done
          env:
            - name: SERVER_NAME
              value: {{ $instance.serverName | quote }}
          resources:
            requests:
              cpu: 1m
              memory: 16Mi
          volumeMounts:
            - name: acme
              mountPath: /acme
              readOnly: true
            - name: tls
              mountPath: /tls
      volumes:
        - name: config-template
          configMap:
            name: {{ $name }}-config-template
        - name: config
          emptyDir: {}
        - name: tls
          emptyDir: {}
        - name: acme
          hostPath:
            path: {{ $hysteria.acmeStoragePath }}
            type: Directory
{{- end }}
{{- end }}
