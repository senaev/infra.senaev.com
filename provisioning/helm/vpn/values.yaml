xrayVpn:
  enabled: true
  instances:
    - name: xray-vpn-firstvds
      vps: firstvds
      exitEnabled: false
      realityServerName: senaev.ru
      profiles:
        - user: user-socks
          uuidMacro: "{XRAY_USER_UUID:1}"
          outbound: outbound-hetzner
    - name: xray-vpn-hetzner
      vps: hetzner
      realityServerName: senaev.com
      profiles:
        - user: user-socks-senaev-media
          uuidMacro: "{XRAY_USER_UUID:3}"
          outbound: outbound-senaev-media
        - user: user-freedom
          uuidMacro: "{XRAY_USER_UUID:5}"
          outbound: outbound-freedom
    - name: xray-vpn-senaev-media
      vps: senaev-media
      profiles: []

vpnSubscription:
  enabled: true
  vps: hetzner
  # Stable checker IDs keep deployment selectors and experiments unchanged on removal.
  entries:
    - probeIndex: 1
      name: "🇫🇮 1. firstvds → hetzner"
      link: "vless://{XRAY_USER_UUID:1}@senaev.ru:443?flow=xtls-rprx-vision&type=tcp&headerType=none&security=reality&fp=chrome&sni=senaev.ru&pbk={XRAY_REALITY_PUBLIC_KEY}&sid="
    - probeIndex: 3
      name: "🇷🇺 3. hetzner → senaev-media"
      link: "vless://{XRAY_USER_UUID:3}@senaev.com:443?flow=xtls-rprx-vision&type=tcp&headerType=none&security=reality&fp=chrome&sni=senaev.com&pbk={XRAY_REALITY_PUBLIC_KEY}&sid="
    - probeIndex: 4
      name: "💄 4. hetzner → freedom"
      link: "vless://{XRAY_USER_UUID:5}@senaev.com:443?flow=xtls-rprx-vision&type=tcp&headerType=none&security=reality&fp=chrome&sni=senaev.com&pbk={XRAY_REALITY_PUBLIC_KEY}&sid="
    # IPv6 literal of hetzner (there are no AAAA records). It changes only if the server is
    # recreated. See projects/2026-10-04-k3s-dual-stack-ipv6/README.md
    - probeIndex: 5
      name: "🌐 5. hetzner IPv6 → freedom"
      link: "vless://{XRAY_USER_UUID:5}@[2a01:4f9:c013:5425::1]:443?flow=xtls-rprx-vision&type=tcp&headerType=none&security=reality&fp=chrome&sni=senaev.com&pbk={XRAY_REALITY_PUBLIC_KEY}&sid="

# Disable only while preparing the namespace before the cutover; see the project runbook.
ingress:
  enabled: true

vpnProbe:
  enabled: true
  # Temporary controlled experiment; false restores all four routine profiles.
  controlledExperiment: true
  vps: senaev-media
  # UUID seeds identify subscription routes, including the IPv6 entry using seed 5.
  # "direct" compares the home exit to the probe's own public home IP.
  expectedExits:
    "1": senaev.com
    "3": direct
    "5": senaev.com
