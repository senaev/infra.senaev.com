xrayVpn:
  enabled: true
  instances:
    - name: xray-vpn-firstvds
      vps: firstvds
      exitEnabled: false
      realityServerName: senaev.ru
      profiles:
        - user: user-socks
          uuidMacro: "{XRAY_USER_UUID:1}"
          outbound: outbound-hetzner
    - name: xray-vpn-hetzner
      vps: hetzner
      realityServerName: senaev.com
      profiles:
        - user: user-socks-senaev-media
          uuidMacro: "{XRAY_USER_UUID:3}"
          outbound: outbound-senaev-media
        - user: user-freedom
          uuidMacro: "{XRAY_USER_UUID:5}"
          outbound: outbound-freedom
    - name: xray-vpn-senaev-media
      vps: senaev-media
      profiles: []

# Hysteria2 (QUIC over UDP) from the client straight to hetzner, exit there. Added
# 2026-11-20: the home ISP sometimes freezes TCP/TLS connections to hetzner for hours while
# UDP (Tailscale) keeps full speed. One pod, one inbound per port. See
# projects/2026-06-10-debug-vpn-connection/README.md
xrayHysteria:
  enabled: true
  vps: hetzner
  # Temporary while the UDP profiles are being debugged: Hysteria errors are logged only at info.
  logLevel: info
  # Traefik on hetzner holds its Let's Encrypt certificate (senaev.com ingress).
  serverName: senaev.com
  # Same as acmeStoragePath of the traefik chart; mounted read-only.
  acmeStoragePath: /k3s-cluster/volumes/traefik/acme
  inbounds:
    # Profile 6. Salamander obfuscation: packets look like random bytes. Passes from FirstVDS,
    # gets no answer from home (2026-11-24).
    - port: 47443
      obfsPasswordMacro: "{XRAY_USER_UUID:6-obfs}"
      profiles:
        - user: user-hysteria
          authMacro: "{XRAY_USER_UUID:6}"
    # Profile 7. Plain HTTP/3 look on UDP 443 (QUIC with SNI senaev.com, a real certificate,
    # the website for anyone without the password). Never tested from home before: the first
    # try (#260) was blocked by our own NetworkPolicy. Traefik does not use UDP 443.
    - port: 443
      profiles:
        - user: user-hysteria-443
          authMacro: "{XRAY_USER_UUID:7}"

# WireGuard from the client straight to hetzner, exit there: the protocol that Tailscale uses
# from home to hetzner at full speed. A diagnostic for now: Happ cannot import WireGuard, so
# profile 8 is only probed, not in the subscription. Added 2026-11-25.
xrayWireguard:
  enabled: true
  vps: hetzner
  # Not 51820 (the well-known WireGuard port) and not Tailscale's 41641 (used on the node).
  port: 41642
  # Tailscale's MTU: fits the home path with room for the WireGuard overhead.
  mtu: 1280
  # Keys: {XRAY_WIREGUARD_PRIVATE_KEY:<seed>} / {XRAY_WIREGUARD_PUBLIC_KEY:<seed>} are derived
  # from XRAY_USER_UUID (render script and vpn-probe), like {XRAY_USER_UUID:<seed>}.
  serverKeySeed: 8-server
  # One peer per probe source: two clients with one key would take over each other's endpoint
  # (WireGuard roaming) and fail for no network reason.
  peers:
    - user: user-wireguard
      keySeed: "8"
      address: 10.0.0.2/32
    - user: user-wireguard-firstvds
      keySeed: 8-firstvds
      address: 10.0.0.3/32

vpnSubscription:
  enabled: true
  vps: hetzner
  # Stable checker IDs keep deployment selectors and experiments unchanged on removal.
  entries:
    - probeIndex: 1
      name: "🇫🇮 1. firstvds → hetzner"
      link: "vless://{XRAY_USER_UUID:1}@senaev.ru:443?flow=xtls-rprx-vision&type=tcp&headerType=none&security=reality&fp=chrome&sni=senaev.ru&pbk={XRAY_REALITY_PUBLIC_KEY}&sid="
    - probeIndex: 3
      name: "🇷🇺 3. hetzner → senaev-media"
      link: "vless://{XRAY_USER_UUID:3}@senaev.com:443?flow=xtls-rprx-vision&type=tcp&headerType=none&security=reality&fp=chrome&sni=senaev.com&pbk={XRAY_REALITY_PUBLIC_KEY}&sid="
    - probeIndex: 4
      name: "💄 4. hetzner → freedom"
      link: "vless://{XRAY_USER_UUID:5}@senaev.com:443?flow=xtls-rprx-vision&type=tcp&headerType=none&security=reality&fp=chrome&sni=senaev.com&pbk={XRAY_REALITY_PUBLIC_KEY}&sid="
    - probeIndex: 6
      name: "⚡ 6. hetzner UDP → freedom"
      link: "hysteria2://{XRAY_USER_UUID:6}@senaev.com:47443?sni=senaev.com&obfs=salamander&obfs-password={XRAY_USER_UUID:6-obfs}"
    - probeIndex: 7
      name: "⚡ 7. hetzner UDP 443 → freedom"
      link: "hysteria2://{XRAY_USER_UUID:7}@senaev.com:443?sni=senaev.com"
    # Probe only (subscription: false): Happ does not support WireGuard links.
    - probeIndex: 8
      name: "🧪 8. hetzner WireGuard → freedom"
      subscription: false
      link: "wireguard://{XRAY_WIREGUARD_PRIVATE_KEY:8}@senaev.com:41642?publickey={XRAY_WIREGUARD_PUBLIC_KEY:8-server}&address=10.0.0.2/32&mtu=1280"
    # IPv6 literal of hetzner (there are no AAAA records). It changes only if the server is
    # recreated. See projects/2026-10-04-k3s-dual-stack-ipv6/README.md
    - probeIndex: 5
      name: "🌐 5. hetzner IPv6 → freedom"
      link: "vless://{XRAY_USER_UUID:5}@[2a01:4f9:c013:5425::1]:443?flow=xtls-rprx-vision&type=tcp&headerType=none&security=reality&fp=chrome&sni=senaev.com&pbk={XRAY_REALITY_PUBLIC_KEY}&sid="

# Disable only while preparing the namespace before the cutover; see the project runbook.
ingress:
  enabled: true

vpnProbe:
  enabled: true
  # Temporary controlled experiment (profiles 1, 3, 4, 6, 7, 8) with production parity checks;
  # false restores the routine profiles.
  controlledExperiment: true
  vps: senaev-media
  # The same profile probed from another node, outside the home ISP: tells an ISP block from a
  # server-side problem. Logs from firstvds are not in Datadog (no agent there); metrics are.
  remoteSources:
    - probeIndex: 6
      vps: firstvds
    - probeIndex: 7
      vps: firstvds
    - probeIndex: 8
      vps: firstvds
      # Its own WireGuard peer (xrayWireguard.peers), not the home probe's key.
      link: "wireguard://{XRAY_WIREGUARD_PRIVATE_KEY:8-firstvds}@senaev.com:41642?publickey={XRAY_WIREGUARD_PUBLIC_KEY:8-server}&address=10.0.0.3/32&mtu=1280"
  # UUID seeds identify subscription routes, including the IPv6 entry using seed 5.
  # "direct" compares the home exit to the probe's own public home IP.
  expectedExits:
    "1": senaev.com
    "3": direct
    "5": senaev.com
    "6": senaev.com
    "7": senaev.com
    "8": senaev.com
    "8-firstvds": senaev.com

# Diagnostic only: never included in the user-facing subscription.
vpnXhttpExperiment:
  enabled: true
  diagnostics: true
  sourceControl: true
  path: /_vpn-xhttp-test/
