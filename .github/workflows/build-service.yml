name: Build Service

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      context:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      registry_image:
        required: true
        type: string
      publish_image:
        required: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: inputs.publish_image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject stale revisions before publishing latest
        if: inputs.publish_image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
          test "$current" = "$GITHUB_SHA"
      - name: Build image before any chart deployment
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: ${{ inputs.publish_image }}
          tags: ${{ inputs.registry_image }}:latest
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}
      - name: Verify published image is publicly pullable before deployment
        if: inputs.publish_image
        env:
          IMAGE_REPOSITORY: ${{ inputs.registry_image }}
        run: |
          python3 - <<'PYTHON'
          import json, os, urllib.request, urllib.error
          repository = os.environ['IMAGE_REPOSITORY'].removeprefix('ghcr.io/')
          try:
              url = 'https://ghcr.io/token?service=ghcr.io&scope=repository:' + repository + ':pull'
              token = json.load(urllib.request.urlopen(url, timeout=20))['token']
              request = urllib.request.Request('https://ghcr.io/v2/' + repository + '/manifests/latest',
                  headers={'Authorization': 'Bearer ' + token,
                           'Accept': 'application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json'}, method='HEAD')
              urllib.request.urlopen(request, timeout=20).close()
          except urllib.error.HTTPError as error:
              raise SystemExit(f'{repository}: published image is not publicly pullable (HTTP {error.code}). Check package visibility/access before deploying.')
          PYTHON
      - name: Notify Telegram
        if: always() && inputs.publish_image
        uses: ./.github/actions/notify-telegram
        with:
          bot_token: ${{ secrets.TG_BOT_TOKEN }}
          status: ${{ job.status }}
          title: Image ${{ inputs.service }}
          link_text: built
