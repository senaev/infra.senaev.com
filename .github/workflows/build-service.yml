name: Build Service

on:
  workflow_call:
    inputs:
      workflow_title:
        required: true
        type: string
      context:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      registry_image:
        required: true
        type: string
      image_tag:
        type: string
        default: latest
      deployment_name:
        required: true
        type: string
      allow_missing_deployment:
        type: boolean
        default: false
      publish_image:
        type: boolean
        default: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: inputs.publish_image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: ${{ inputs.publish_image }}
          tags: ${{ inputs.registry_image }}:${{ inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Restart deployment via SSH
        if: inputs.publish_image
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          script: |
            set -e
            deployment=$(kubectl -n senaev-com get deployment/${{ inputs.deployment_name }} --ignore-not-found -o name)
            if [ -n "$deployment" ]; then
              kubectl -n senaev-com rollout restart "$deployment"
              kubectl -n senaev-com rollout status "$deployment" --timeout=180s
            elif [ "${{ inputs.allow_missing_deployment }}" != "true" ]; then
              echo "Deployment ${{ inputs.deployment_name }} is missing" >&2
              exit 1
            fi

      - name: Notify Telegram
        if: always() && inputs.publish_image
        uses: ./.github/actions/notify-telegram
        with:
          bot_token: ${{ secrets.TG_BOT_TOKEN }}
          status: ${{ job.status }}
          title: ${{ inputs.workflow_title }}
          link_text: built
