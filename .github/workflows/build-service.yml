name: Build Service

on:
  workflow_call:
    inputs:
      workflow_title:
        required: true
        type: string
      context:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      registry_image:
        required: true
        type: string
      deployment_name:
        required: true
        type: string
      publish_image:
        type: boolean
        default: true
      restart_deployment:
        type: boolean
        default: true
      allow_missing_deployment:
        type: boolean
        default: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: inputs.publish_image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: ${{ inputs.publish_image }}
          tags: ${{ inputs.registry_image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Restart deployment via SSH
        if: inputs.restart_deployment && inputs.publish_image
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          script: |
            set -e
            if [ "${{ inputs.allow_missing_deployment }}" = "true" ]; then
              existing=$(kubectl -n senaev-com get deployment/${{ inputs.deployment_name }} --ignore-not-found -o name)
              if [ -z "$existing" ]; then
                echo "First deployment: image published; Helm will create the Deployment."
                exit 0
              fi
            fi
            kubectl -n senaev-com rollout restart deployment/${{ inputs.deployment_name }}
            kubectl -n senaev-com rollout status deployment/${{ inputs.deployment_name }} --timeout=180s

      - name: Notify Telegram
        if: always() && inputs.publish_image
        uses: ./.github/actions/notify-telegram
        with:
          bot_token: ${{ secrets.TG_BOT_TOKEN }}
          status: ${{ job.status }}
          title: ${{ inputs.workflow_title }}
          link_text: built
