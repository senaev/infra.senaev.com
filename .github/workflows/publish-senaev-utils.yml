name: senaev-utils

# Publishing stays on npm even though five services in this repo consume the package,
# because supabase-list-notes lives elsewhere and installs it from the registry.

on:
  push:
    branches: [main, master]
    paths:
      - "senaev-utils/**"
      - ".github/workflows/publish-senaev-utils.yml"
  workflow_dispatch:

concurrency:
  group: publish-senaev-utils-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_DIST_TAG: ci

jobs:
  ci:
    name: Lint, Test, Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: senaev-utils
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25.9.0
          cache: npm
          cache-dependency-path: senaev-utils/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test:ci

      - name: Run typecheck
        run: npm run typecheck

  publish:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      package_version: ${{ steps.package.outputs.version }}
    permissions:
      contents: read
      # Trusted publishing: npm mints the credential from this token, so there is no
      # NODE_AUTH_TOKEN. The trusted publisher on npmjs.com is bound to both the repository
      # and this workflow's filename, so renaming either one breaks publishing.
      id-token: write
    defaults:
      run:
        working-directory: senaev-utils
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest
          check-latest: true
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: senaev-utils/package-lock.json

      - name: Show tool versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Set CI package version
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          npm version "${BASE_VERSION}-ci.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" --no-git-tag-version

      - name: Read package version
        id: package
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish package
        run: npm publish --tag "$NPM_DIST_TAG"

  notify:
    name: Notify Telegram
    needs:
      - ci
      - publish
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Notify Telegram
        run: |
          if [ "${{ needs.publish.result }}" = "success" ]; then
            STATUS_ICON="✅"
            STATUS_TEXT="success"
          else
            STATUS_ICON="❌"
            STATUS_TEXT="error"
          fi

          TEXT="${STATUS_ICON} <b>senaev-utils#</b><code>${{ needs.publish.outputs.package_version || '??unknown??' }}</code> <a href=\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\">${STATUS_TEXT}</a>"

          curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=-1003971743999" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=${TEXT}"
