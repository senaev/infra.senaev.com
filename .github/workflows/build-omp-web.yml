name: omp-web

on:
  push:
    branches: [main, master]
    paths:
      - "omp-web/**"
      - ".github/workflows/build-omp-web.yml"
  pull_request:
    paths:
      - "omp-web/**"
      - ".github/workflows/build-service.yml"
      - ".github/workflows/build-omp-web.yml"
  workflow_dispatch:

jobs:
  check:
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml

  build-and-push:
    needs: check
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-service.yml
    with:
      workflow_title: omp-web
      context: .
      dockerfile: ./omp-web/Dockerfile
      registry_image: ghcr.io/senaev/opencode-serve
      image_tag: omp-web
      publish_image: ${{ github.event_name != 'pull_request' }}
      deployment_name: omp-web
      allow_missing_deployment: true
    secrets: inherit
