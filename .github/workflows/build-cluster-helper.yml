name: cluster-helper

on:
  push:
    branches: [main, master]
    paths:
      - "cluster-helper/**"
      # senaev-utils is linked from the repo rather than installed from npm, so
      # a change to it changes what this image ships.
      - "senaev-utils/**"
  workflow_dispatch:

jobs:
  check:
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml

  build-and-push:
    needs: check
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-service.yml
    with:
      workflow_title: cluster-helper
      context: .
      dockerfile: ./cluster-helper/Dockerfile
      registry_image: ghcr.io/senaev/cluster-helper
      deployment_name: cluster-helper
    secrets: inherit
