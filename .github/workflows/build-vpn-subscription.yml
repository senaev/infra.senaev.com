name: vpn-subscription

on:
  push:
    branches: [main, master]
    paths:
      - "vpn-subscription/**"
      # senaev-utils is linked from the repo rather than installed from npm, so
      # a change to it changes what this image ships.
      - "senaev-utils/**"
  workflow_dispatch:

jobs:
  check:
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml

  build-and-push:
    needs: check
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-service.yml
    with:
      workflow_title: vpn-subscription
      context: .
      dockerfile: ./vpn-subscription/Dockerfile
      registry_image: ghcr.io/senaev/vpn-subscription
      deployment_name: vpn-subscription
    secrets: inherit
