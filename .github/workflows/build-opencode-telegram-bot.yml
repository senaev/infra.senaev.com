name: opencode-telegram-bot

on:
  push:
    branches: [main, master]
    paths:
      - "opencode-telegram-bot/**"
      - ".github/workflows/build-opencode-telegram-bot.yml"
  pull_request:
    paths:
      - "opencode-telegram-bot/**"
      - ".github/workflows/build-service.yml"
      - ".github/workflows/build-opencode-telegram-bot.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-service.yml
    with:
      workflow_title: opencode-telegram-bot
      context: ./opencode-telegram-bot
      dockerfile: ./opencode-telegram-bot/Dockerfile
      registry_image: ghcr.io/senaev/opencode-telegram-bot
      publish_image: ${{ github.event_name != 'pull_request' }}
      deployment_name: opencode-telegram
    secrets: inherit
