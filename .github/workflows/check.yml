name: Check

# Shared gate for deployment and npm publishing.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  check:
    name: Lint, Typecheck, Test, Syntax
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      # code-tools searches with ripgrep, as it does in the code-tools image. Downloaded from the
      # GitHub release, not apt: an Ubuntu mirror outage blocked every check on 2026-11-11.
      - name: Install ripgrep
        env:
          RIPGREP_VERSION: 14.1.1
          RIPGREP_SHA256: 4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e
        run: |
          command -v rg && exit 0
          archive="ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/$archive.tar.gz"
          echo "${RIPGREP_SHA256}  $RUNNER_TEMP/$archive.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$archive" >> "$GITHUB_PATH"

      # Typed linting, tsc and the tests all resolve each package's own imports, so every
      # package needs its dependencies present. There is no workspace hoisting to rely on.
      - name: Install the shared toolchain and package dependencies
        run: npm run ci:all

      # One step, the same command the pre-push hook runs, so local and CI cannot drift.
      # concurrently runs all checks at once and lets each finish even when another fails,
      # so a red build reports every problem instead of only the first one.
      # The Python, shell and Helm syntax checks use python3, bash and helm from the runner image.
      - name: Lint, typecheck, test and syntax checks
        run: npm run simple-checks

      - name: VPN probe unit tests
        run: python3 -m unittest discover -s vpn-probe -p "test_*.py"
