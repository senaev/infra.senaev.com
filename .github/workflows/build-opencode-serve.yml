name: opencode-serve

on:
  push:
    branches: [main, master]
    paths:
      - "opencode-serve/**"
      - ".github/workflows/build-opencode-serve.yml"
  pull_request:
    paths:
      - "opencode-serve/**"
      - ".github/workflows/build-service.yml"
      - ".github/workflows/build-opencode-serve.yml"
  workflow_dispatch:

jobs:
  check:
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml

  build-and-push:
    needs: check
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-service.yml
    with:
      workflow_title: opencode-serve
      context: .
      dockerfile: ./opencode-serve/Dockerfile
      registry_image: ghcr.io/senaev/opencode-serve
      publish_image: ${{ github.event_name != 'pull_request' }}
      deployment_name: opencode-telegram
    secrets: inherit
