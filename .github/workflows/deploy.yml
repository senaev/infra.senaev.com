name: Read-only K3s incident diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read service state and incident journal
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          script: |
            date -u
            if test -f /etc/udev/rules.d/99-tailscale-k3s.rules; then cat /etc/udev/rules.d/99-tailscale-k3s.rules; else echo 'K3s recovery udev rule MISSING'; fi
            systemctl show sys-subsystem-net-devices-tailscale0.device -p ActiveState -p Wants -p SysFSPath
            udevadm info --query=property --path=/sys/class/net/tailscale0 | grep -E '^SYSTEMD_WANTS=|^TAGS='
            tailscale debug prefs | python3 -c 'import json,sys; print("AutoUpdate:",json.load(sys.stdin).get("AutoUpdate"))'
            journalctl --utc -u tailscaled --since '2026-11-10 06:24:00' --until '2026-11-10 06:27:00' --no-pager | grep -Ei 'update|apt-get|restarting|version|Stopping|Started|signal' | sed -E '/(token|password|secret|authorization|private.key)/Id' | tail -n 35
