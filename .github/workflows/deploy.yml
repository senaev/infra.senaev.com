name: Read-only K3s incident diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read service state and incident journal
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          script: |
            date -u
            hostname
            systemctl show k3s -p ActiveState -p SubState -p Result -p ExecMainStatus -p ActiveEnterTimestamp -p InactiveEnterTimestamp -p NRestarts
            journalctl --utc -u k3s --since '2026-11-10 04:30:00' --until '2026-11-10 07:00:00' --no-pager -n 180 | sed -E '/(token|password|secret|authorization|private.key)/Id'
            journalctl --utc -u k3s --since '2026-11-10 07:00:00' --no-pager -n 45 | sed -E '/(token|password|secret|authorization|private.key)/Id'
            journalctl --utc -u apt-daily-upgrade.service -u unattended-upgrades.service --since '2026-11-10 04:30:00' --until '2026-11-10 07:00:00' --no-pager -n 35
            ss -lntp | awk 'NR == 1 || /:6443 |:22 /'
