name: Read-only FirstVDS website diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 157.22.197.112
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          script: |
            date -u
            hostname
            systemctl show k3s-agent -p ActiveState -p SubState -p InactiveEnterTimestamp
            systemctl show tailscaled -p ActiveState -p ActiveEnterTimestamp
            journalctl --utc -u k3s-agent --since '2026-11-10 04:00:00' --until '2026-11-10 07:00:00' --no-pager | grep -E 'Stopping|Stopped|Starting|Started|tailscale|flannel|exited|Failed' | sed -E '/(token|password|secret|authorization|private.key)/Id' | tail -n 45
            journalctl --utc -u tailscaled --since '2026-11-10 04:00:00' --until '2026-11-10 07:00:00' --no-pager | grep -E 'c2n:|Stopping|Started' | sed -E '/(token|password|secret|authorization|private.key)/Id' | tail -n 15
            ip -br link show flannel.1
            curl --silent --show-error --head --connect-timeout 3 --max-time 8 --output /dev/null --write-out 'fallback HTTP=%{http_code} TLS=%{time_appconnect}\n' --connect-to senaev.ru:443:traefik-firstvds.traefik.svc.cluster.local:8443 https://senaev.ru/
