name: Read-only K3s incident diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read service state and incident journal
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          script: |
            date -u
            systemctl show k3s -p ActiveState -p SubState -p BindsTo -p PartOf -p Requires -p After -p Restart -p ExecStartPre
            systemctl show tailscaled -p ActiveState -p SubState -p ActiveEnterTimestamp -p NRestarts
            journalctl --utc -u tailscaled --since '2026-11-10 06:25:00' --until '2026-11-10 06:29:00' --no-pager -n 70 | sed -E '/(token|password|secret|authorization|private.key)/Id'
            journalctl --utc --since '2026-11-10 06:26:00' --until '2026-11-10 06:27:00' --no-pager | grep -E 'tailscale|k3s.service|apt|needrestart|sudo.*COMMAND' | sed -E '/(token|password|secret|authorization|private.key)/Id' | tail -n 65
            tail -n 55 /var/log/apt/history.log
            systemctl cat k3s | grep -E '^#|^\[|^BindsTo|^PartOf|^Requires|^After|^Restart|^ExecStartPre'
