name: Update Helm Charts

on:
  push:
    branches: [main, master]
    paths:
      - 'provisioning/helm/**'

jobs:
  update-charts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chart: ['datadog', 'external-secrets', 'senaev-com', 'test', 'traefik', 'vault', 'vm-operator', 'vm-stack']
        include:
          - chart: datadog
            namespace: datadog
          - chart: external-secrets
            namespace: external-secrets
          - chart: senaev-com
            namespace: senaev-com
          - chart: test
            namespace: test
          - chart: traefik
            namespace: traefik
          - chart: vault
            namespace: vault
          - chart: vm-operator
            namespace: telemetry
          - chart: vm-stack
            namespace: telemetry

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        env:
          BEFORE: ${{ github.event.before }}
          CHART_DIR: provisioning/helm/${{ matrix.chart }}/
        run: |
          # A new branch or a force push has no usable "before" commit: deploy the chart.
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "$GITHUB_SHA" -- "$CHART_DIR"; then
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync provisioning to server
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: burnett01/rsync-deployments@9.0.0
        with:
          switches: -avzr --delete
          path: "provisioning/helm/${{ matrix.chart }}/"
          remote_path: "/k3s-cluster/provisioning/helm/${{ matrix.chart }}/"
          remote_host: ${{ secrets.REMOTE_HOST }}
          remote_user: ${{ secrets.REMOTE_USER }}
          remote_key: ${{ secrets.REMOTE_SSH_KEY }}

      - name: Update chart
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          script: |
            set -e
            /k3s-cluster/provisioning/control-plane/upgrade-namespace.sh ${{ matrix.chart }} ${{ matrix.namespace }}

      - name: Notify Telegram
        if: always() && steps.changed-files.outputs.any_changed == 'true'
        uses: ./.github/actions/notify-telegram
        with:
          bot_token: ${{ secrets.TG_BOT_TOKEN }}
          status: ${{ job.status }}
          title: Helm chart ${{ matrix.chart }}
          link_text: update
